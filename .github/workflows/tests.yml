name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # .python-version (3.13) is also what Render reads, so CI and the
          # deployed server use the same Python minor version.
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install pinned dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # No secrets are provided: tests use in-memory fakes and block the network.
        run: pytest -q
